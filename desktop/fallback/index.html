<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bodega</title>
		<link rel="stylesheet" href="style.css" />
		<script type="module" src="app.js"></script>
	</head>
	<body>
		<main>
			<svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
				<rect x="3" y="5" width="26" height="23" rx="6" fill="#d9611e" />
				<rect x="3" y="20" width="26" height="8" fill="#000" opacity=".18" />
				<rect x="8" y="11" width="16" height="2.6" rx="1.3" fill="#fff" />
				<rect x="8" y="16" width="9" height="2.6" rx="1.3" fill="#fff" />
			</svg>
			<h1>El motor de Bodega no está corriendo</h1>
			<p class="lead">
				Esta ventana muestra el dashboard que sirve el motor local de tu Mac.
				Arráncalo y se abre solo.
			</p>
			<button id="start" class="btn primary" type="button">
				Iniciar motor
			</button>
			<p id="status" class="status" role="status" aria-live="polite"></p>
			<section id="install" class="install" hidden>
				<p>
					El motor no está instalado como servicio. Desde la carpeta de Bodega,
					córrelo una vez y vuelve a intentar:
				</p>
				<div class="code">
					<code id="command">npm link &amp;&amp; bodega install</code>
					<button id="copy" class="btn" type="button">Copiar</button>
				</div>
			</section>
		</main>
	</body>
</html>
